info:
  name: Project Health
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/{{project}}/health"
  headers:
    - name: Accept
      value: application/json
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Stato di un singolo progetto. Impostare `project` con lo slug presente nella configurazione.
