info:
  name: Tail Incremental
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/{{project}}/tail"
  params:
    - name: limit
      value: "{{limit}}"
      type: query
    - name: after
      value: "{{cursor}}"
      type: query
  headers:
    - name: Accept
      value: application/json
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lettura incrementale del tail dopo il cursor precedente. Richiede una variabile `cursor` valorizzata.
