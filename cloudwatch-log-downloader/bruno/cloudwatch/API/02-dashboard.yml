http:
  method: GET
  url: "{{baseUrl}}/api/v1/dashboard"
  headers:
    - name: Accept
      value: application/json
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Dashboard aggregata dei progetti con status, metriche e log group configurati/risolti.
